name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Test package
        run: swift test

  mcp:
    name: MCP build, tests, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run license:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify bundled data parity
        working-directory: .
        run: |
          cmp mcp-server/data/target-curves.json Sources/AuralinkCore/Resources/data/target-curves.json
          cmp mcp-server/data/safety-rules.json Sources/AuralinkCore/Resources/data/safety-rules.json

      - name: Verify no headphone data ships
        working-directory: .
        # Headphone profiles and curated presets belong to the user's own collection.
        # Shipping them would present one person's measurements and taste as factory
        # truth, which is exactly what this repository stopped doing.
        run: |
          for stale in \
            mcp-server/data/headphone-profiles.json \
            Sources/AuralinkCore/Resources/data/headphone-profiles.json \
            library
          do
            if [ -e "$stale" ]; then
              echo "::error::$stale is back. Headphone data must live in the user's collection (docs/DATA_COLLECTION.md)."
              exit 1
            fi
          done

      - name: Test legacy-to-collection migration
        working-directory: .
        # The migration script is the only code that preserves pre-split user
        # data; it is exercised end-to-end against scratch fixtures (first run,
        # idempotency, no-clobber conflicts, invalid ids, corrupt manifest).
        run: node --test scripts/migrate-collection.test.mjs

  release-app:
    name: Build Auralink EQ.app artifact
    runs-on: macos-15
    timeout-minutes: 40
    needs: [swift, mcp]
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Bundle release app
        run: ./scripts/bundle-app.sh
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auralink-EQ-app
          path: build/Auralink EQ.app
          if-no-files-found: error
          retention-days: 7
